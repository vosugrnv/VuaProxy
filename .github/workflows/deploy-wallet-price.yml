name: deploy-wallet-price
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Restore original checkout pricing
        env:
          VPS_PASS: ${{ secrets.VPS_PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$VPS_PASS"
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25"
          SCP="sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=25"
          DEST=root@187.127.207.14
          for f in orders.js order-qr.js wallet.js; do
            $SCP "api/src/$f" "$DEST:/var/www/vuaproxy-api/src/$f"
          done
          $SSH "$DEST" 'bash -s' <<'R'
          set -euo pipefail
          rm -f /var/www/vuaproxy-api/src/pricing.js
          cd /var/www/vuaproxy-api
          node --check src/orders.js
          node --check src/order-qr.js
          node --check src/wallet.js
          if grep -q enforcePrices src/orders.js src/order-qr.js; then
            echo "price lock still present"
            exit 1
          fi
          pm2 restart vuaproxy-api --update-env
          sleep 2
          curl -sS -m 8 http://127.0.0.1:3101/health; echo
          echo PAYMENT_LOGIC_RESTORED
          R
