name: reset-admin-password
on: workflow_dispatch
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Set admin password on VPS
        env:
          VPS_PASS: ${{ secrets.VPS_PASS }}
          ADMIN_PASS: ${{ secrets.ADMIN_PANEL_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_PASS}" ]; then
            echo "ADMIN_PANEL_PASSWORD secret is empty"
            exit 1
          fi
          export SSHPASS="$VPS_PASS"
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25"
          B64=$(printf '%s' "$ADMIN_PASS" | base64 -w0)
          $SSH root@187.127.207.14 "export ADMIN_PASS_B64='$B64'; bash -s" <<'R'
          set -euo pipefail
          test -n "${ADMIN_PASS_B64:-}"
          cd /var/www/vuaproxy-api
          node <<'JS'
          const bcrypt = require("bcryptjs");
          const http = require("http");
          const config = require("./src/config");
          const { pool } = require("./src/db");

          function login(email, password) {
            const body = JSON.stringify({ email, password });
            return new Promise((resolve, reject) => {
              const req = http.request({
                hostname: "127.0.0.1",
                port: 3101,
                path: "/auth/login",
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Content-Length": Buffer.byteLength(body)
                },
                timeout: 8000
              }, (res) => {
                const chunks = [];
                res.on("data", (c) => chunks.push(c));
                res.on("end", () => {
                  let parsed = {};
                  try { parsed = JSON.parse(Buffer.concat(chunks).toString("utf8")); } catch (_) {}
                  resolve({
                    status: res.statusCode,
                    isAdmin: !!(parsed.user && parsed.user.isAdmin)
                  });
                });
              });
              req.on("error", reject);
              req.on("timeout", () => req.destroy(new Error("login timeout")));
              req.write(body);
              req.end();
            });
          }

          (async () => {
            const pass = Buffer.from(process.env.ADMIN_PASS_B64 || "", "base64").toString("utf8");
            if (pass.length < 6) {
              console.error("password too short");
              process.exit(1);
            }
            const emails = config.adminEmails;
            if (!emails.length) {
              console.error("ADMIN_EMAILS empty");
              process.exit(1);
            }
            const hash = await bcrypt.hash(pass, 10);
            const updated = await pool.query(
              `UPDATE users SET password_hash = $1 WHERE lower(email) = ANY($2::text[]) RETURNING email`,
              [hash, emails]
            );
            const got = updated.rows.map((r) => String(r.email).toLowerCase());
            console.log("updated", got.join(",") || "(none)");
            const missing = emails.filter((e) => !got.includes(e));
            if (missing.length) console.log("missing", missing.join(","));
            if (!got.length) process.exit(1);
            let failed = false;
            for (const email of got) {
              const result = await login(email, pass);
              console.log("login", email, result.status, "isAdmin", result.isAdmin);
              if (result.status !== 200 || !result.isAdmin) failed = true;
            }
            await pool.end();
            if (failed) process.exit(1);
            console.log("ADMIN_PASSWORD_OK");
          })().catch((err) => {
            const msg = String(err && err.message || err).replace(/postgres:\/\/\S+/g, "postgres://***");
            console.error(msg);
            process.exit(1);
          });
          JS
          R
