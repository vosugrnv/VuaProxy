<body class="check-proxy-solo">

<a class="cp-home" href="/">← Vua Proxy</a>

<main class="check-proxy-page">
 <div class="cp-wrap">
  <div class="cp-left">
   <div class="cp-form">
    <label for="proxyFormat">Proxy Format</label>
    <select id="proxyFormat">
     <option value="host:port:username:password">host:port:username:password</option>
     <option value="username:password@host:port">username:password@host:port</option>
     <option value="username:password:host:port">username:password:host:port</option>
     <option value="host:port@username:password">host:port@username:password</option>
     <option value="host:port">host:port</option>
    </select>

    <label for="proxyType">Proxy Type</label>
    <select id="proxyType">
     <option value="auto">Auto (HTTP then SOCKS5)</option>
     <option value="http">HTTP</option>
     <option value="socks5">SOCKS5</option>
    </select>

    <label for="proxyList">Proxy List (0)</label>
    <textarea id="proxyList" rows="5" placeholder="Enter Proxies"></textarea>

    <button type="button" id="checkButton" class="cp-btn">Check</button>
    <div class="cp-progress" id="progressBar"><div class="cp-progress-fill" id="progressFill"></div></div>
    <div class="cp-progress-text" id="progressText"></div>
   </div>

   <div class="cp-status">
    <h2 class="active-proxy">Active Proxies (0)</h2>
    <textarea id="activeProxies" readonly></textarea>
    <button type="button" class="cp-btn cp-btn--copy" data-copy="activeProxies">Copy</button>
   </div>
   <div class="cp-status">
    <h2 class="inactive-proxy">Inactive Proxies (0)</h2>
    <textarea id="inactiveProxies" readonly></textarea>
    <button type="button" class="cp-btn cp-btn--copy" data-copy="inactiveProxies">Copy</button>
   </div>
  </div>

  <div class="cp-right">
   <div class="cp-results">
    <h2>Proxy Check Results</h2>
    <div class="cp-table-wrap">
     <table>
      <colgroup>
       <col class="cp-col-no">
       <col class="cp-col-proxy">
       <col class="cp-col-ip">
       <col class="cp-col-status">
       <col class="cp-col-type">
      </colgroup>
      <thead>
       <tr>
        <th>No</th>
        <th>Proxy</th>
        <th>IP Address</th>
        <th>Status</th>
        <th>Type</th>
       </tr>
      </thead>
      <tbody id="resultTable"></tbody>
     </table>
    </div>
   </div>
  </div>
 </div>
</main>

<div class="toast" id="toast"></div>
